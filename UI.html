<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans p-6">

    <div class="max-w-5xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                NeuroScan AI Analytics
            </h1>
            <p class="text-slate-400 mt-2">Deep Learning MRI Analysis for Alzheimer's Detection</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <span class="mr-2">📁</span> Input MRI Scan
                    </h2>

                    <div class="relative group border-2 border-dashed border-slate-600 rounded-xl p-4 transition-colors hover:border-blue-500">
                        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                        <div class="text-center">
                            <img id="preview" class="hidden w-full h-48 object-cover rounded-lg mb-4 border border-slate-600" />
                            <p id="placeholderText" class="text-slate-500 py-10">Click to upload or drag & drop</p>
                        </div>
                    </div>

                    <button onclick="uploadImage()" id="btn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-900/20">
                        Run Diagnostics
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="resultPlaceholder" class="h-full flex items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl bg-slate-800/50">
                    <p class="text-slate-500 italic">Upload an image to generate analytics report</p>
                </div>

                <div id="resultArea" class="hidden space-y-6">
                    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl grid grid-cols-2 gap-4">
                        <div class="border-r border-slate-700">
                            <p class="text-xs uppercase text-slate-500 font-bold tracking-widest">Primary Classification</p>
                            <h3 id="label" class="text-3xl font-bold text-blue-400 mt-1">--</h3>
                        </div>
                        <div class="pl-4">
                            <p class="text-xs uppercase text-slate-500 font-bold tracking-widest">Confidence Score</p>
                            <h3 id="confidence" class="text-3xl font-bold text-emerald-400 mt-1">--</h3>
                        </div>
                    </div>

                    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h2 class="text-lg font-semibold mb-4">Probability Distribution</h2>
                        <div class="h-64">
                            <canvas id="predictionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        function previewImage(event) {
            const preview = document.getElementById('preview');
            const placeholder = document.getElementById('placeholderText');
            preview.src = URL.createObjectURL(event.target.files[0]);
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) return alert("Upload a scan first.");

            const btn = document.getElementById('btn');
            btn.innerText = "Analyzing Neural Patterns...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', { method: 'POST', body: formData });
                const data = await response.json();

                // Show Results Area
                document.getElementById('resultPlaceholder').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');

                // Update Text
                document.getElementById('label').innerText = data.prediction;
                document.getElementById('confidence').innerText = (data.confidence * 100).toFixed(2) + "%";

                // Update Chart
                updateChart(data.raw_predictions[0]);

            } catch (e) {
                alert("Connection to API failed.");
            } finally {
                btn.innerText = "Run Diagnostics";
                btn.disabled = false;
            }
        }

        function updateChart(probabilities) {
            const ctx = document.getElementById('predictionChart').getContext('2d');
            const labels = ["Mild", "Moderate", "None", "Very Mild"];

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Probability',
                        data: probabilities,
                        backgroundColor: probabilities.map(v => v === Math.max(...probabilities) ? '#60a5fa' : '#334155'),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 1, grid: { color: '#1e293b' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
