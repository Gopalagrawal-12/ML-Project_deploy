<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan | Clinical Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .clinical-card { background: #111827; border: 1px solid #1f2937; }
        .glass-effect { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-black text-slate-200 min-h-screen p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="border-b border-slate-800 pb-6 mb-10 flex flex-col md:flex-row justify-between items-end">
            <div>
                <h1 class="text-3xl text-white tracking-tight">NeuroScan <span class="text-blue-500 text-sm align-top font-sans">v2.4.0</span></h1>
                <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest">Diagnostic Image Analysis & Reporting</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-xs text-slate-500" id="currentDate"></p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="clinical-card p-6 rounded-lg shadow-2xl">
                    <h2 class="text-xl text-white mb-6">Patient MRI Input</h2>
                    
                    <div class="relative group border border-slate-700 rounded-lg overflow-hidden bg-slate-900/50 hover:border-blue-500 transition-all">
                        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                        <div class="p-4 text-center">
                            <img id="preview" class="hidden w-full aspect-square object-cover rounded border border-slate-800 mb-4" />
                            <div id="dropZoneText" class="py-12">
                                <span class="text-4xl block mb-2 opacity-50">⊕</span>
                                <p class="text-slate-400 text-sm">Select scan for analysis</p>
                            </div>
                        </div>
                    </div>

                    <button onclick="uploadImage()" id="btn" class="w-full mt-6 bg-white text-black font-bold py-3 px-6 rounded hover:bg-slate-200 transition-all uppercase text-xs tracking-widest">
                        Initialize Diagnostics
                    </button>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="resultPlaceholder" class="h-full min-h-[400px] flex items-center justify-center border border-slate-800 rounded-lg bg-slate-950/30 border-dashed">
                    <div class="text-center">
                        <div class="inline-block w-8 h-8 border-2 border-slate-700 border-t-blue-500 rounded-full animate-spin mb-4 opacity-0" id="spinner"></div>
                        <p class="text-slate-600 italic">Awaiting high-resolution scan input...</p>
                    </div>
                </div>

                <div id="resultArea" class="hidden space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="clinical-card p-6 rounded-lg">
                            <p class="text-[10px] uppercase text-slate-500 font-bold tracking-tighter mb-1">Primary Classification</p>
                            <h3 id="label" class="text-2xl font-semibold text-white">--</h3>
                        </div>

                        <div class="clinical-card p-6 rounded-lg">
                            <p class="text-[10px] uppercase text-slate-500 font-bold tracking-tighter mb-1">Impairment Status</p>
                            <div id="impairmentBadge" class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mt-1">
                                --
                            </div>
                        </div>
                    </div>

                    <div class="clinical-card p-8 rounded-lg">
                        <div class="flex justify-between items-center mb-8">
                            <h2 class="text-xl text-white">Probability Metrics</h2>
                            <div class="text-right">
                                <p class="text-[10px] uppercase text-slate-500 font-bold">Confidence</p>
                                <span id="confidence" class="text-blue-400 font-mono text-lg">--</span>
                            </div>
                        </div>
                        <div class="h-64">
                            <canvas id="predictionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let myChart = null;

        function previewImage(event) {
            const preview = document.getElementById('preview');
            const dropZoneText = document.getElementById('dropZoneText');
            preview.src = URL.createObjectURL(event.target.files[0]);
            preview.classList.remove('hidden');
            dropZoneText.classList.add('hidden');
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) return alert("System requires scan file.");

            const btn = document.getElementById('btn');
            const spinner = document.getElementById('spinner');
            btn.innerText = "Analyzing...";
            btn.classList.add('opacity-50');
            spinner.classList.remove('opacity-0');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://3.27.45.153:8000/predict', { method: 'POST', body: formData });
                const data = await response.json();

                document.getElementById('resultPlaceholder').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');

                // Update Classification
                const label = data.prediction;
                document.getElementById('label').innerText = label;
                document.getElementById('confidence').innerText = (data.confidence * 100).toFixed(2) + "%";

                // Set Impairment Status Logic
                const badge = document.getElementById('impairmentBadge');
                if (label.toLowerCase().includes("non")) {
                    badge.innerText = "No Impairment";
                    badge.className = "inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mt-1 bg-emerald-900/30 text-emerald-400 border border-emerald-800";
                } else {
                    badge.innerText = "Impairment Detected";
                    badge.className = "inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mt-1 bg-red-900/30 text-red-400 border border-red-800";
                }

                updateChart(data.raw_predictions[0]);

            } catch (e) {
                alert("Diagnostic server unreachable.");
            } finally {
                btn.innerText = "Initialize Diagnostics";
                btn.classList.remove('opacity-50');
                spinner.classList.add('opacity-0');
            }
        }

        function updateChart(probabilities) {
            const ctx = document.getElementById('predictionChart').getContext('2d');
            const labels = ["Mild", "Moderate", "None", "Very Mild"];
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: probabilities,
                        backgroundColor: '#3b82f6',
                        hoverBackgroundColor: '#ffffff',
                        barThickness: 20,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: 1, 
                            ticks: { color: '#475569', font: { size: 10 } },
                            grid: { color: '#1e293b' } 
                        },
                        x: { 
                            ticks: { color: '#94a3b8', font: { size: 11 } },
                            grid: { display: false } 
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
